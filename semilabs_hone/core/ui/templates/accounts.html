{% extends "base.html" %}
{% block title %}Skim - 账号管理{% endblock %}

{% block content %}
<h2>账号管理</h2>

<section>
  <h3>添加账号</h3>
  <form hx-post="/api/accounts" hx-target="#accounts-list" hx-swap="outerHTML" hx-on::after-request="this.reset()">
    <div class="grid">
      <label>
        平台
        <select name="platform">
          {% for p in platforms %}
          <option value="{{ p }}">{{ p }}</option>
          {% endfor %}
          {% if not platforms %}
          <option value="xiaohongshu">xiaohongshu</option>
          {% endif %}
        </select>
      </label>
      <label>
        昵称
        <input type="text" name="nickname" placeholder="可选">
      </label>
    </div>
    <button type="submit">添加账号</button>
  </form>
</section>

<section>
  <h3>导入 Cookie</h3>
  <form hx-post="/api/accounts/import-cookies" hx-target="#accounts-list" hx-swap="outerHTML">
    <label>
      账号 ID
      <input type="number" name="account_id" required>
    </label>
    <label>
      Cookie JSON
      <textarea name="cookies" rows="3" placeholder='[{"name":"...", "value":"...", "domain":"..."}]'></textarea>
    </label>
    <button type="submit">导入</button>
  </form>
</section>

{% include "_accounts_table.html" %}

<!-- Notifications area -->
<div id="notification-area" class="notification-area"></div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('htmx:afterRequest', function(evt) {
  if (evt.detail.failed) {
    showNotification('操作失败: ' + (evt.detail.xhr?.responseText || '未知错误'), 'error');
  }
});

function showNotification(message, type) {
  var area = document.getElementById('notification-area');
  var div = document.createElement('div');
  div.className = 'alert alert-' + type;
  div.textContent = message;
  area.appendChild(div);
  setTimeout(function() { div.remove(); }, 5000);
}
</script>
{% endblock %}
