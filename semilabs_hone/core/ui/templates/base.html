<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}semilabs-hone{% endblock %}</title>
  <!-- Vendored locally: a local-first tool must not depend on a CDN at runtime. -->
  <link rel="stylesheet" href="/static/vendor/pico.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
</head>
<body>
  <nav class="container-fluid">
    <ul>
      <li><a href="/" class="logo"><strong>semilabs-hone</strong></a></li>
    </ul>
    <ul class="nav-tabs">
      {% set mods = get_modules() %}
      {% for mid, mod in mods.items() %}
        {% for entry in mod.nav or [] %}
        <li><a href="{{ entry.url }}" class="nav-tab">{{ mod.name }} · {{ entry.label }}</a></li>
        {% endfor %}
      {% endfor %}
    </ul>
    <ul>
      <li>
        <span id="ws-status" class="ws-indicator" title="WebSocket 连接状态">
          <span class="ws-dot"></span> WS
        </span>
      </li>
      <li>
        <span id="heartbeat-indicator" class="heartbeat-indicator" title="Worker 心跳 (10s 轮询)"
              hx-get="/api/heartbeat" hx-trigger="load, every 10s" hx-swap="innerHTML">
          <span class="heartbeat-dot"></span> 检测中…
        </span>
      </li>
    </ul>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
