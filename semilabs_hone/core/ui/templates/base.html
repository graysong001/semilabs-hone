<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}内容工厂{% endblock %} · 内容工厂</title>
  <!-- Google Fonts: 未来感科技字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&family=Exo+2:wght@700;900&display=swap" rel="stylesheet">
  <!-- Tailwind CDN + 暗色科技风色板 (ui_design_spec_v2 §2) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'app':     { DEFAULT: '#1B202B', content: '#222733', card: '#2A303D', hover: '#313847', input: '#1E242F' },
            'brand':   { DEFAULT: '#007BFF', light: '#1A8CFF', dark: '#0066D6' },
            'success': { DEFAULT: '#00E396' },
            'warning': { DEFAULT: '#FEB019' },
            'danger':  { DEFAULT: '#FF4560' },
          }
        }
      }
    }
  </script>
  <!-- HTMX 2.0.4 (保持项目现状, 特性兼容规范 1.9.10) -->
  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-app text-gray-300">
<div class="flex min-h-screen">
  {% include "partials/_sidebar.html" %}
  <div class="flex-1 ml-[240px] flex flex-col min-h-screen bg-app-content">
    <!-- 顶部状态栏 (60px) -->
    <header class="h-[60px] bg-app border-b border-gray-700/60 flex items-center justify-between px-8 sticky top-0 z-40">
      <div class="flex-1"></div>
      <div class="flex items-center gap-4">
        <!-- 全局搜索 -->
        <div class="relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500" width="14" height="14"
               fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="7" cy="7" r="5"/><path d="M15 15l-3-3"/>
          </svg>
          <input type="text" placeholder="Search..."
                 class="w-48 h-9 pl-9 pr-3 bg-app-input border border-gray-700 rounded-lg text-sm
                        text-gray-300 placeholder-gray-500 focus:border-brand focus:outline-none focus:w-64 transition-all">
        </div>
        <!-- Worker 心跳灯 (HTMX 轮询 /api/heartbeat, 10s) -->
        <div class="flex items-center gap-2 px-3 py-1.5 bg-app-card rounded-lg border border-gray-700"
             hx-get="/api/heartbeat" hx-trigger="load, every 10s" hx-swap="innerHTML">
          <span class="text-xs text-gray-400">检测中…</span>
        </div>
        <!-- 用户头像 -->
        <div class="w-9 h-9 rounded-full bg-brand/20 text-brand flex items-center justify-center text-sm font-bold">U</div>
      </div>
    </header>
    <main class="flex-1 p-8">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2"></div>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
