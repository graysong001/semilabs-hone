<dialog open id="account-edit-dialog" class="modal-backdrop fixed inset-0 bg-black/50 flex items-center justify-center z-50"
        hx-on:htmx:after-swap="this.querySelector('dialog').showModal()">
  <div class="bg-app-card border border-gray-700 rounded-lg p-6 w-full max-w-md" onclick="event.stopPropagation()">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-semibold text-white">编辑备注 · 账号 #{{ account.id }}</h3>
      <button type="button" onclick="document.getElementById('account-edit-dialog').remove()"
              class="text-gray-400 hover:text-white">✕</button>
    </div>
    <form hx-put="/api/accounts/{{ account.id }}"
          hx-swap="none"
          hx-on::after-request="if(event.detail.successful){document.getElementById('account-edit-dialog').remove();showToast({severity:'success',message:'备注已更新',duration:2000});setTimeout(()=>location.reload(),1500);}else{showToast({severity:'error',message:'更新失败',duration:3000});}">
      <div class="mb-4">
        <label class="block text-sm text-gray-300 mb-2">账号备注 <span class="text-red-400">*</span></label>
        <input type="text" name="remark" required maxlength="100" value="{{ account.remark or '' }}"
               class="w-full h-10 px-3 bg-app-input border border-gray-600 rounded-lg text-sm text-gray-200 placeholder-gray-500 focus:border-brand focus:outline-none">
      </div>
      <p class="text-xs text-gray-500 mb-4">
        备注是你对这个账号的别名（如"小号A"），与平台显示的真实昵称无关。<br>
        平台身份（<code class="text-gray-400">platform_user_id</code> / <code class="text-gray-400">platform_nickname</code>）由系统自动提取，不可手改。
      </p>
      <div class="flex justify-end gap-2">
        <button type="button" onclick="document.getElementById('account-edit-dialog').remove()"
                class="px-4 py-2 bg-gray-600/20 text-gray-300 border border-gray-600/40 rounded-lg text-sm">取消</button>
        <button type="submit" class="px-4 py-2 bg-brand hover:bg-brand-dark text-white rounded-lg text-sm font-medium">保存</button>
      </div>
    </form>
  </div>
</dialog>
