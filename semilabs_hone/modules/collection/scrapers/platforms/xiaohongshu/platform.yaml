platform: xiaohongshu
display_name: 小红书
base_url: https://www.xiaohongshu.com

# 验证码可选能力 (契约§5): XHS 是 account 站, 默认 manual 命中即转人工。
risk_tier: account
captcha_policy: manual

login:
  type: qrcode
  login_url: /login
  # url_change: success_pattern 对 URL path 做正则匹配；"^/$" = 扫码后跳回首页
  success_detect: url_change
  success_pattern: "^/$"
  timeout: 120
  # [契约变更 2026-07-13 S10] 登录成功后提取平台真实身份（三标识）
  identity_api: /api/sns/web/v1/user/selfinfo
  identity_map:
    user_id: "data.user.id"
    nickname: "data.user.nickname"
  # [2026-07-31 实测] 登录态 DOM 判定（selfinfo 裸 fetch 被网关签名拦 500，
  # 首页未登录不跳 /login 而是弹登录框，故以页面真实 DOM 为准）：
  logged_in_selector: ".side-bar .user img"   # 侧栏头像可见 = 已登录（已实测）
  login_modal_selector: ".login-container"    # 登录弹窗可见 = 未登录

flows:
  search:
    steps:
      # sort 由 sort_values 映射后代入 (USER_SOP G16: 以前排序选了也不生效)
      - type: navigate
        url: "/search_result?keyword={keyword}&source=web_search_result_notes&sort={sort}"
      - type: wait_xhr
        # [2026-07-31] 放宽匹配: 子串 "search/notes" 兼容 v1→v2 版本变更;
        # 去掉 method 限制兼容 POST→GET 切换 (小红书可能改为 GET 请求).
        url_pattern: "search/notes"
        save_as: search_resp
        timeout_ms: 15000
        # SSR hydration 降级: XHR 超时时从页面内嵌 JS 全局变量提取搜索数据
        ssr_state_key: "window.__INITIAL_STATE__"
        ssr_state_path: "note.noteList"
      # 翻页增量采集: scroll_collect 自带 seed extract (首屏), 之后每轮滚动从
      # 拦截 buffer 取下一条 search/notes 响应增量提取+跨页去重; 不再有独立
      # extract 步骤 (否则首屏数据会重复入库)。empty_break=5 次无新即收,
      # max_scrolls=20 硬顶 (PRD §8.4 场景4.2)。
      - type: scroll_collect
        from: search_resp
        url_pattern: "search/notes"
        group: ItemRef
        map:
          item_id: "$.id"
          title: "$.note_card.display_title"
          author_name: "$.note_card.user.nickname"
          likes: "$.note_card.interact_info.liked_count"
        # DOM fallback: when XHR interception times out, extract from rendered page.
        dom_container: "section[data-note-id]"
        dom_fallback:
          item_id: "attr:data-note-id"
          title: "css:a.title span, .note-item .title"
          author_name: "css:.author .name-time-wrapper .name, .author-wrapper .name, [class*='author'] .name"
          likes: "css:[class*='like'] .count, .like-wrapper .count"
        max_scrolls: 20
        empty_break: 5
        wait_ms: 1500

  detail:
    steps:
      - type: navigate
        url: "/explore/{item_id}"
      - type: wait_xhr
        url_pattern: "/api/sns/web/v1/feed"
        method: POST
        save_as: feed_resp
        timeout_ms: 15000
      - type: extract
        from: feed_resp
        group: Post.body
        map:
          platform_id: "$.note.note_id"
          title: "$.note.title"
          content: "$.note.desc"
          author_name: "$.note.user.nickname"
          post_type: "$.note.type"
          published_at: "$.note.time"
      - type: extract
        from: feed_resp
        group: Post.interactions
        map:
          likes: "$.note.interact_info.liked_count"
          collects: "$.note.interact_info.collected_count"
          comments_count: "$.note.interact_info.comment_count"
          shares: "$.note.interact_info.share_count"

  comments:
    steps:
      # 评论是滚动懒加载的: 没有触发步时 wait_xhr 必超时 (USER_SOP G16)
      - type: scroll
        max_times: 2
        wait_ms: 1200
      - type: wait_xhr
        url_pattern: "/api/sns/web/v2/comment/page"
        method: GET
        save_as: cmt_resp
        timeout_ms: 15000
      - type: extract
        from: cmt_resp
        group: Comments
        map:
          platform_id: "$.id"
          author_name: "$.user.nickname"
          content: "$.content"
          likes: "$.like_count"

sort_values:
  general: general
  time_descending: time_descending
  popularity_descending: popularity_descending
